<script data-dc-script data-props='{"accent":{"editor":"color","default":"#256abf","options":["#256abf","#1f1e1c","#c94a36","#1f7a55"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  soft(hex, alpha) {
    var m = /^#?([0-9a-f]{6})/i.exec(hex || '');
    if (!m) return 'rgba(37, 106, 191, ' + alpha + ')';
    var n = parseInt(m[1], 16);
    return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + alpha + ')';
  }
  renderVals() {
    var accent = this.props.accent ?? '#256abf';
    return { accent: accent, accentSoft: this.soft(accent, 0.1), accentLine: this.soft(accent, 0.45) };
  }
}
</script>
