name: Probar y publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas (base de datos y colector)
        run: npm test

      - name: Build
        # Usa las variables del repositorio si existen; si no, .env.production.
        run: |
          if [ -n "$SUPABASE_URL" ]; then export VITE_SUPABASE_URL="$SUPABASE_URL"; fi
          if [ -n "$SUPABASE_KEY" ]; then export VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_KEY"; fi
          npm run build
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Preparar servidor FTP
        # Acepta el valor tal como lo copia Hostinger ("ftp://IP", con espacios o puerto).
        if: ${{ env.FTP_SERVER != '' }}
        run: |
          raw="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          host="$(printf '%s' "$raw" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1 || true)"
          if [ -z "$host" ]; then host="$(printf '%s' "$raw" | sed -E 's#^.*://##; s#/.*$##; s#:[0-9]+$##')"; fi
          if [ -z "$host" ]; then echo "::error::FTP_SERVER está vacío o no tiene un servidor válido"; exit 1; fi
          echo "::add-mask::$host"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

      - name: Subir a Hostinger por FTP
        # Se salta hasta que configures los secretos FTP_* en GitHub.
        # La cuenta FTP debe apuntar a la carpeta del subdominio: así se sube a su raíz
        # y el deploy no puede tocar el resto del sitio.
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
