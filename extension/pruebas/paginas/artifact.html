<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Citas de prueba</title>
    <style>
      /* Como un artifact de Claude: una barra arriba y todo el contenido en un marco de otro dominio. */
      html, body { margin: 0; height: 100%; overflow: hidden; font: 14px Helvetica, Arial, sans-serif; }
      .barra { height: 40px; display: flex; align-items: center; padding: 0 12px; background: #1f1e1c; color: #fff; }
      iframe { display: block; border: 0; width: 100%; height: calc(100% - 40px); }
    </style>
  </head>
  <body>
    <div class="barra">Barra de la aplicación: no debe salir en la captura</div>
    <iframe sandbox="allow-scripts allow-same-origin allow-forms" src="http://localhost:8766/marco.html"></iframe>
  </body>
</html>
