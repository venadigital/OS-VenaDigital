<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Como un sitio con la política más dura: ni estilos ni scripts en línea. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'none'; script-src 'none'" />
    <title>Sitio con política estricta</title>
  </head>
  <body>
    <h1>Sitio con política estricta</h1>
    <p>La barra tiene que verse y funcionar aunque la página no admita estilos en línea.</p>
    <p>Texto de relleno para tener algo sobre lo que dibujar.</p>
  </body>
</html>
